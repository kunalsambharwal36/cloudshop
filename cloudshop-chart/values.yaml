productService:
  replicaCount: 1

  image:
    repository: kunalsambharwal36/cloudshop-product-service
    tag: test123
    pullPolicy: Always

  containerPort: 8000

  service:
    type: ClusterIP
    port: 80
    targetPort: 8000

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

  hpa:
    minReplicas: 1
    maxReplicas: 5
    targetCPUUtilizationPercentage: 50

orderService:
  replicaCount: 1

  image:
    repository: order-service
    tag: v2
    pullPolicy: Never

  service:
    type: ClusterIP
    port: 80
    targetPort: 8000

consumer:
  replicaCount: 1

  image:
    repository: order-consumer
    tag: v1
    pullPolicy: Never

kafka:
  bootstrap: cloudshop-kafka-kafka-bootstrap.kafka.svc.cluster.local:9092

database:
  url: postgresql://postgres:admin123@postgres-postgresql.database.svc.cluster.local:5432/cloudshop
