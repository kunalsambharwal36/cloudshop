apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-service
  namespace: cloudshop

spec:
  replicas: 1

  selector:
    matchLabels:
      app: product-service

  template:
    metadata:
      labels:
        app: product-service

    spec:
      containers:
      - name: product-service
        image: product-service:v2

        imagePullPolicy: Never

        ports:
        - containerPort: 8000

        env:
        - name: DATABASE_URL
          value: "postgresql://postgres:admin123@postgres-postgresql.database.svc.cluster.local:5432/cloudshop"

        readinessProbe:
          httpGet:
            path: /
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5

        livenessProbe:
          httpGet:
            path: /
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 10

        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"

          limits:
            cpu: "500m"
            memory: "512Mi"
