apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: cloudshop
spec:
  replicas: 1
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
    spec:
      containers:
      - name: order-service
        image: order-service:v2
        imagePullPolicy: Never
        ports:
        - containerPort: 8000
        env:
        - name: KAFKA_BOOTSTRAP
          value: cloudshop-kafka-kafka-bootstrap.kafka.svc.cluster.local:9092
